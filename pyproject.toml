[project]
name = "memory-based-sa-nav"
version = "0.1.0"
description = "Memory-based spatial-alignment navigation with visual memory retrieval."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "torch",
  "transformers",
  "faiss-cpu",
  "Pillow",
  "huggingface_hub",
  "safetensors",
  "fastapi",
  "uvicorn",
  "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memory_nav*"]
